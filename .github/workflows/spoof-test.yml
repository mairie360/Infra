# Spoofed e-mail test of the external attack campaigns, monthly and on demand.
#
#   1. creates the attack source (attack-source/, project mairie360-attack) with spoof_test:
#      SMTP egress open, and at boot it sends one e-mail with a forged From: in
#      mairie360-eip.fr to the Resend inbox of mairie360.fr;
#   2. scripts/spoof-check.py checks the published DMARC policy (quarantine or reject) and
#      that Resend judged the e-mail dmarc=fail;
#   3. destroys the server whatever happened (the reserved IP and the security group stay,
#      the security group back to Scaleway's SMTP block).
#
# Environment attack-spoof-test, deployment branch `main`: key of the IAM application
# mairie360-ci-spoof-test (iam/campaigns.tf), whose write and delete rights only reach the
# mairie360-attack project, and on the state bucket attack-source.tfstate only; a Resend
# key that reads received e-mails.
name: Spoof test

on:
  schedule:
    # First Monday of the month (the `when` job keeps it), 09:47 UTC.
    - cron: "47 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Shares the attack-source state with campaign windows applied by hand.
  group: attack-source
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "1"
  FROM_DOMAIN: mairie360-eip.fr

jobs:
  when:
    name: first Monday of the month or manual run
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      run: ${{ steps.day.outputs.run }}
    steps:
      - id: day
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != schedule ] || [ "$(date -u +%-d)" -le 7 ]; then
            echo run=true >> "$GITHUB_OUTPUT"
          else
            echo run=false >> "$GITHUB_OUTPUT"
          fi

  spoof:
    name: a forged From is refused
    needs: when
    if: needs.when.outputs.run == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: attack-spoof-test
    env:
      SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
      SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
      SCW_DEFAULT_ORGANIZATION_ID: ${{ vars.SCW_DEFAULT_ORGANIZATION_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.SCW_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCW_SECRET_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false

      - name: Create the source, which sends the spoofed e-mail
        id: send
        run: |
          token="$(openssl rand -hex 16)"
          echo "token=$token" >> "$GITHUB_OUTPUT"
          printf 'spoof_test = { to = "spoof-test@mairie360.fr", from = "noreply@%s", token = "%s" }\n' \
            "$FROM_DOMAIN" "$token" > attack-source/spoof.auto.tfvars
          scripts/tf.sh attack-source apply -input=false -auto-approve -var enabled=true

      - name: Check the verdict
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TOKEN: ${{ steps.send.outputs.token }}
        run: python3 scripts/spoof-check.py --token "$TOKEN" --from-domain "$FROM_DOMAIN" --summary "$GITHUB_STEP_SUMMARY"

      - name: Destroy the source
        if: always()
        run: |
          rm -f attack-source/spoof.auto.tfvars
          scripts/tf.sh attack-source apply -input=false -auto-approve -var enabled=false
